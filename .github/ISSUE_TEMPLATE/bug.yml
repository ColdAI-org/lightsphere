name: Bug report
description: Something in the contracts, harness or client does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issues must not be reported here.** Follow SECURITY.md instead."
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [contracts, harness (Go), client (TypeScript), docs, brand]
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse HEAD`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands and output. A failing Foundry, Go or node test is ideal.
      render: shell
    validations:
      required: true
