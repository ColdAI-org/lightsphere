# Keeps the SHA-pinned actions and the dependency lockfiles current. Each update is a reviewed PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: gomod
    directory: /harness
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(harness)"
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(client)"
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(contracts)"
