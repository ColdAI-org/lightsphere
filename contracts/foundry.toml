[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 1000
via_ir = true
# Hedera's EVM supports Cancun opcodes; do not target newer forks.
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
